# BELT Sample Sheet Configuration - Converted from ED15-SampleSheet.csv
# Motif-based demultiplexing configuration with Levenshtein distance for indel handling

# Global demultiplexing parameters
parameters:
  search_window: 200  # Number of bases to search from each end

# Barcode motifs configuration - treating old barcodes as motifs
motifs:
  forward:
    barcode1_CCTACGTTCTCGTTGCCGTT:
      sequence: "CCTACGTTCTCGTTGCCGTT"
      max_mismatches: 5
    barcode1_GAGGTTGCAATCGTACTCCC:
      sequence: "GAGGTTGCAATCGTACTCCC"
      max_mismatches: 5
    barcode1_GCCGAACATAGTGATATCAG:
      sequence: "GCCGAACATAGTGATATCAG"
      max_mismatches: 5
  
  reverse:
    barcode2_TCGAAATCTAACCAACGAGA:
      sequence: "TCGAAATCTAACCAACGAGA"
      max_mismatches: 5
    barcode2_GATCTTAGACAACGCAACTA:
      sequence: "GATCTTAGACAACGCAACTA"
      max_mismatches: 5
    barcode2_ACGCCTTTCCGGATCCGTAC:
      sequence: "ACGCCTTTCCGGATCCGTAC"
      max_mismatches: 5
    barcode2_CTGTCGCGTGATGAGAAGCC:
      sequence: "CTGTCGCGTGATGAGAAGCC"
      max_mismatches: 5

# Sample definitions - each sample requires specific barcode combinations
samples:
  - name: "ED15-[WT-A]"
    forward_motifs: ["barcode1_CCTACGTTCTCGTTGCCGTT"]
    reverse_motifs: ["barcode2_TCGAAATCTAACCAACGAGA"]
    
  - name: "ED15-[WT-B]"
    forward_motifs: ["barcode1_GAGGTTGCAATCGTACTCCC"]
    reverse_motifs: ["barcode2_TCGAAATCTAACCAACGAGA"]
    
  - name: "ED15-[WT-C]"
    forward_motifs: ["barcode1_GCCGAACATAGTGATATCAG"]
    reverse_motifs: ["barcode2_TCGAAATCTAACCAACGAGA"]
    
  - name: "ED15-[K65R-A]"
    forward_motifs: ["barcode1_CCTACGTTCTCGTTGCCGTT"]
    reverse_motifs: ["barcode2_GATCTTAGACAACGCAACTA"]
    
  - name: "ED15-[K65R-B]"
    forward_motifs: ["barcode1_GAGGTTGCAATCGTACTCCC"]
    reverse_motifs: ["barcode2_GATCTTAGACAACGCAACTA"]
    
  - name: "ED15-[K65R-C]"
