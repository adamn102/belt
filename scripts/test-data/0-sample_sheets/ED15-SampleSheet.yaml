      max_mismatches: 5
    barcode2_CTGTCGCGTGATGAGAAGCC:
      sequence: "CTGTCGCGTGATGAGAAGCC"
      max_mismatches: 5
    barcode2_TACAGCGTACACACGTTAAG:
      sequence: "TACAGCGTACACACGTTAAG"
      max_mismatches: 5
    barcode2_ATTGAATACACAATGAACCG:
