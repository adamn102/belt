# BELT Demo Pipeline Configuration
# This file configures the demo pipeline to process the test data

# Sample definitions
# Each sample should have a corresponding FASTQ file in data/1-fastq_files/
samples:
  B145-XTMMF9-12: data/1-fastq_files/B145-XTMMF9-12.fastq

# Barcode motifs for UMI extraction
# These patterns define where UMIs are located in the reference sequence
barcodes:
  B145-XTMMF9-12: NNNNNNNNNNNNNNM

# Minimum read lengths for quality filtering
# Reads shorter than this will be filtered out
min_lengths:
  B145-XTMMF9-12: 1000

# UMI whitelist settings
# Options: "false" (no whitelist), "cluster" (use clustering), or filename
whitelist:
  B145-XTMMF9-12: "false"  # Use clustering instead of whitelist for demo

# Pipeline parameters
pipeline:
  # Number of threads for parallel processing
  threads: 1
  
  # Quality filtering parameters
  quality:
    min_quality: 25      # Minimum Phred quality score
    unqualified_percent: 50  # Maximum percentage of low-quality bases
    
  # UMI grouping parameters
  umi_grouping:
    grouping_method: "5pUMI"  # Group by 5' UMI
    threshold: 5              # Minimum reads per UMI group
    
  # Consensus calling parameters
  consensus:
    threads: 8                # Threads for consensus calling
